<!DOCTYPE html>
<html lang="es-ES">
<head>
  <meta charset="UTF-8">
  <title>Presentación de la demo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,800&display=swap" rel="stylesheet">
  <style>
    :root {
      --crema: #FAF5EE;
      --arcilla: #F1E6D8;
      --arena: #DCC8AF;
      --texto: #3B2A20;
      --texto-suave: #6A5242;
      --terracota: #A84B2A;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 1280px;
      height: 720px;
      overflow: hidden;
    }

    body {
      font-family: 'Nunito Sans', system-ui, sans-serif;
      color: var(--texto);
      background:
        radial-gradient(circle at 92% 12%, rgba(168, 75, 42, 0.10) 0, rgba(168, 75, 42, 0) 34%),
        radial-gradient(circle at 8% 96%, rgba(122, 92, 62, 0.10) 0, rgba(122, 92, 62, 0) 30%),
        linear-gradient(135deg, var(--crema) 0%, var(--arcilla) 100%);
      display: flex;
      align-items: center;
    }

    /* Vasija decorativa en línea, a la derecha */
    .vasija {
      position: absolute;
      right: 56px;
      bottom: 0;
      width: 210px;
      opacity: 0;
      transform: translateY(24px);
    }

    .contenido {
      padding: 0 120px;
      max-width: 1060px;
      position: relative;
    }

    .etiqueta {
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--terracota);
      margin: 0 0 14px;
    }

    h1 {
      font-family: 'Fraunces', Georgia, serif;
      font-weight: 700;
      font-size: 56px;
      line-height: 1.05;
      letter-spacing: -0.015em;
      margin: 0 0 22px;
    }

    .descripcion {
      font-size: 23px;
      line-height: 1.5;
      color: var(--texto-suave);
      margin: 0 0 30px;
      max-width: 880px;
    }

    .descripcion strong { color: var(--texto); font-weight: 800; }

    .linea {
      width: 72px;
      height: 4px;
      border-radius: 2px;
      background: var(--terracota);
      margin: 0 0 26px;
    }

    ol {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px 56px;
      max-width: 900px;
    }

    li {
      display: flex;
      gap: 16px;
      font-size: 17px;
      line-height: 1.4;
      color: var(--texto);
      opacity: 0;
      transform: translateY(6px);
    }

    li .n {
      flex: none;
      width: 20px;
      font-weight: 800;
      color: var(--terracota);
    }

    .aparece { animation: aparecer 0.6s ease forwards; }

    @keyframes aparecer { to { opacity: 1; transform: none; } }
  </style>
</head>
<body>
  <svg class="vasija" viewBox="0 0 200 240" aria-hidden="true">
    <path d="M70 18 h60 v14 c0 8 -8 12 -8 22 c0 14 46 34 46 92 c0 50 -32 80 -68 80 c-36 0 -68 -30 -68 -80 c0 -58 46 -78 46 -92 c0 -10 -8 -14 -8 -22 z"
          fill="#E2C6A6" stroke="#B9895E" stroke-width="3"/>
    <path d="M44 128 c34 12 78 12 112 0" fill="none" stroke="#A84B2A" stroke-width="5" stroke-linecap="round" opacity=".75"/>
    <path d="M40 150 c38 14 82 14 120 0" fill="none" stroke="#7A5C3E" stroke-width="3" stroke-linecap="round" opacity=".5"/>
    <path d="M70 18 h60" stroke="#B9895E" stroke-width="6" stroke-linecap="round"/>
  </svg>

  <main class="contenido">
    <p class="etiqueta" id="etiqueta"></p>
    <h1 id="titulo"></h1>
    <p class="descripcion" id="descripcion"></p>
    <div class="linea"></div>
    <ol id="escenarios"></ol>
  </main>

  <script>
    // Datos de la demo en el fragmento de la URL: { etiqueta, titulo, descripcion (HTML con <strong>), escenarios: [] }
    const datos = JSON.parse(decodeURIComponent(location.hash.slice(1)));
    document.getElementById('etiqueta').textContent = datos.etiqueta;
    document.getElementById('titulo').textContent = datos.titulo;
    document.getElementById('descripcion').innerHTML = datos.descripcion;
    document.title = datos.titulo;

    // Ordenado por columnas como en la referencia: 1 y 2 en la primera fila, 3 y 4 en la segunda…
    const lista = document.getElementById('escenarios');
    datos.escenarios.forEach((texto, i) => {
      const li = document.createElement('li');
      li.innerHTML = '<span class="n"></span><span class="t"></span>';
      li.querySelector('.n').textContent = i + 1;
      li.querySelector('.t').textContent = texto;
      lista.appendChild(li);
    });

    window.iniciarAnimacion = () => {
      document.querySelector('.vasija').animate(
        [{ opacity: 0, transform: 'translateY(24px)' }, { opacity: 0.9, transform: 'none' }],
        { duration: 900, fill: 'forwards', easing: 'ease-out' }
      );
      [...lista.children].forEach((li, i) => {
        setTimeout(() => li.classList.add('aparece'), 1400 + i * 650);
      });
    };
  </script>
</body>
</html>
