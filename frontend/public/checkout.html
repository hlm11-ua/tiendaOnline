<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pasarela de Pago Seguro con Tarjeta | TiendaOnline</title>
  <meta name="description" content="Tramita tu compra online de forma rápida y segura con tarjeta bancaria. Confirmación condicionada, reserva de existencias y autenticación reforzada 3D Secure.">

  <!-- Tipografía moderna Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">

  <!-- Estilos de la pasarela de pago -->
  <link rel="stylesheet" href="/src/styles/checkout.css">
</head>
<body>
  <!-- Encabezado del sitio -->
  <header class="site-header" role="banner">
    <div class="header-container">
      <a href="/" class="brand-wrapper" id="link-home">
        <span class="brand-icon" aria-hidden="true">🛍️</span>
        <span class="brand-title">TiendaOnline</span>
      </a>
      <div class="header-badge" id="badge-seguridad">
        <span aria-hidden="true">🔒</span>
        <span>Pasarela Bancaria Segura (PSD2 / TLS)</span>
      </div>
    </div>
  </header>

  <!-- Contenedor Principal de Checkout -->
  <main class="main-content" role="main">
    <a href="/catalogo" class="checkout-volver-enlace" id="link-volver-catalogo">← Volver al catálogo</a>

    <h1 class="sr-only" style="position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); border: 0;">Pasarela de Pago Seguro con Tarjeta Bancaria</h1>

    <!-- Temporizador regresivo de reserva de stock -->
    <div id="reservation-timer-container"></div>

    <!-- Vista de Checkout (Formulario + Cesta) -->
    <div class="checkout-grid-layout" id="checkout-view">
      <!-- Columna Izquierda: Formulario de pago -->
      <div id="checkout-form-container"></div>

      <!-- Columna Derecha: Resumen de la cesta real del comprador (Feature 002) -->
      <aside class="summary-card" id="order-summary-sidebar" aria-labelledby="summary-title">
        <div class="card-header">
          <h2 id="summary-title" class="card-title">Resumen de la Cesta</h2>
          <p class="card-subtitle">Artículos de tu cesta que vas a comprar</p>
        </div>

        <div class="cart-items-list" id="cart-items-container">
          <!-- Se inyecta dinámicamente con JavaScript -->
        </div>

        <div class="summary-totals">
          <div class="total-line">
            <span>Subtotal de artículos:</span>
            <span class="font-mono" id="label-subtotal">45,00 €</span>
          </div>
          <div class="total-line">
            <span>Gastos de envío:</span>
            <span class="font-bold text-success" style="color: #10b981;">Gratis</span>
          </div>
          <div class="total-line total-final">
            <span>Total a pagar:</span>
            <span class="font-mono text-primary" id="label-total-sidebar" style="color: #818cf8;">45,00 €</span>
          </div>
        </div>
      </aside>
    </div>

    <!-- Vista de Justificante / Confirmación de Pedido (inicialmente oculta) -->
    <div id="receipt-container" class="hidden"></div>

    <!-- Contenedor del Modal 3D Secure -->
    <div id="modal-3ds-container"></div>
  </main>

  <!-- Orquestación frontend mediante módulos ES6 -->
  <script type="module">
    import { PaymentApiService } from '/src/services/payment-api.service.js';
    import { ReservationTimer } from '/src/components/reservation-timer.js';
    import { Payment3DSModal } from '/src/components/payment-3ds-modal.js';
    import { OrderReceipt } from '/src/components/order-receipt.js';
    import { CheckoutForm } from '/src/components/checkout-form.js';
    import { CartStorageService } from '/src/services/cart-storage.service.js';
    import { CartApiService } from '/src/services/cart-api.service.js';

    let activeItems = [];
    let currentSession = null;

    const formatoEUR = new Intl.NumberFormat('es-ES', { style: 'currency', currency: 'EUR' });
    const formatEUR = (importe) => formatoEUR.format(Number(importe) || 0);

    // Feature 002: el checkout consume la cesta persistente real del comprador
    // (LocalStorage para anónimos o carrito remoto vía parámetro usuarioId)
    async function cargarCestaPersistente() {
      const params = new URLSearchParams(window.location.search);
      const usuarioId = params.get('usuarioId');
      if (usuarioId) {
        CartStorageService.setUsuarioId(usuarioId);
      }

      let lineas;
      try {
        const carrito = await CartStorageService.getCart();
        lineas = (carrito?.items || []).filter(
          it => it.varianteId && Number(it.cantidad) > 0 &&
                it.estado !== 'agotado' && it.estado !== 'no_disponible'
        );
      } catch {
        lineas = [];
      }

      if (lineas.length === 0) {
        return [];
      }

      // FR-005 / FR-006: al tramitar el pedido se sincronizan precios vigentes y
      // existencias reales contra el catálogo antes de reservar e iniciar el cobro
      try {
        const validacion = await CartApiService.validarStock(
          lineas.map(it => ({
            varianteId: it.varianteId,
            cantidad: it.cantidad,
            precioUnitario: it.precioUnitario
          }))
        );
        const porVariante = new Map(validacion.items.map(v => [v.varianteId, v]));

        return lineas
          .map(linea => {
            const v = porVariante.get(linea.varianteId);
            if (!v) return null;
            const disponible = v.estado === 'disponible' || v.estado === 'reajustado';
            const cantidad = disponible ? v.cantidadAjustada : 0;
            if (cantidad <= 0) return null;
            return {
              varianteId: linea.varianteId,
              cantidad,
              nombre: linea.titulo || v.titulo,
              precioUnitario: v.precioVigente ?? linea.precioUnitario,
              stockDisponible: v.stockDisponible
            };
          })
          .filter(Boolean);
      } catch {
        // Sin validación disponible: la reserva del backend decide de forma autoritativa
        return lineas.map(it => ({
          varianteId: it.varianteId,
          cantidad: it.cantidad,
          nombre: it.titulo || it.varianteId,
          precioUnitario: it.precioUnitario
        }));
      }
    }

    // FR-001 / FR-008: sin artículos válidos no hay nada que cobrar (zero-state)
    function mostrarCestaVacia() {
      activeItems = [];
      currentSession = null;
      renderSidebarItems([], 0);
      const timerContainer = document.getElementById('reservation-timer-container');
      if (timerContainer) timerContainer.innerHTML = '';
      timer.stop();
      const formContainer = document.getElementById('checkout-form-container');
      if (formContainer) formContainer.classList.add('hidden');
    }

    // 1. Instanciar componentes
    const timer = new ReservationTimer({
      containerId: 'reservation-timer-container',
      onExpired: () => {
        checkoutForm.showError('La sesión de reserva de stock ha expirado (10 minutos superados). Por favor, revisa tu cesta para continuar.');
        checkoutForm.setSubmitting(true); // Bloquear botón
      }
    });

    const modal3ds = new Payment3DSModal({
      containerId: 'modal-3ds-container',
      onConfirm: async ({ transaccionId, codigoOtp }) => {
        try {
          const resultado = await PaymentApiService.verificar3DS({ transaccionId, codigoOtp });
          modal3ds.close();
          finalizarConExito(resultado.pedido);
        } catch (err) {
          modal3ds.showError(err.message || 'Código 3D Secure incorrecto o caducado.');
          // Si el 3DS falló definitivamente, informar en el formulario
          if (err.codigo === '3DS_FALLIDO') {
            setTimeout(() => {
              modal3ds.close();
              checkoutForm.showError('Autenticación bancaria 3D Secure denegada. La reserva de inventario ha sido liberada.');
              checkoutForm.setSubmitting(false);
            }, 1800);
          }
        }
      },
      onCancel: () => {
        checkoutForm.setSubmitting(false);
        checkoutForm.showError('Verificación bancaria cancelada por el comprador.');
      }
    });

    const receipt = new OrderReceipt({
      containerId: 'receipt-container',
      onNewOrder: () => {
        // La cesta se ha vaciado tras el cobro: el checkout vuelve al estado vacío
        document.getElementById('receipt-container').classList.add('hidden');
        document.getElementById('checkout-view').classList.remove('hidden');
        mostrarCestaVacia();
      }
    });

    const checkoutForm = new CheckoutForm({
      containerId: 'checkout-form-container',
      onSubmit: async (datos) => {
        if (!currentSession) {
          checkoutForm.showError('No hay una sesión de compra activa. Vuelve a tu cesta e inténtalo de nuevo.');
          return;
        }
        try {
          const res = await PaymentApiService.procesarPago({
            sesionPagoId: currentSession.sesionPagoId,
            clienteNombre: datos.clienteNombre,
            clienteEmail: datos.clienteEmail,
            tokenTarjeta: datos.tokenTarjeta
          });

          if (res.estado === 'requiere_3ds') {
            modal3ds.open({
              transaccionId: res.transaccionId,
              desafio3ds: res.desafio3ds
            });
          } else if (res.estado === 'autorizado') {
            finalizarConExito(res.pedido);
          }
        } catch (err) {
          checkoutForm.showError(err.message || 'Error al procesar el pago.');
        }
      }
    });

    // 2. Transición a pantalla de justificante al confirmar compra
    async function finalizarConExito(pedido) {
      timer.stop();
      document.getElementById('reservation-timer-container').innerHTML = '';
      document.getElementById('checkout-view').classList.add('hidden');
      document.getElementById('receipt-container').classList.remove('hidden');
      receipt.render(pedido);

      // Feature 002: vaciado automático de la cesta tras confirmación de cobro
      try {
        await CartStorageService.clearCart();
        if (CartStorageService.usuarioId) {
          await CartApiService.vaciarCarrito(CartStorageService.usuarioId);
        }
      } catch {
        // El justificante de compra ya se ha emitido; el vaciado es best-effort
      }
    }

    // 3. Renderizar los artículos reales de la cesta en la barra lateral
    function renderSidebarItems(items, total) {
      const container = document.getElementById('cart-items-container');
      const subtotalLabel = document.getElementById('label-subtotal');
      const totalLabel = document.getElementById('label-total-sidebar');

      if (!items || items.length === 0) {
        if (subtotalLabel) subtotalLabel.textContent = formatEUR(0);
        if (totalLabel) totalLabel.textContent = formatEUR(0);
        if (container) {
          container.innerHTML = `
            <div class="checkout-empty-state">
              <span class="empty-icon" aria-hidden="true">🧺</span>
              <p class="empty-title">Tu cesta está vacía</p>
              <p class="empty-text">Añade piezas artesanales a tu cesta para poder tramitar el pedido.</p>
              <a href="/carrito" class="empty-btn">Volver a la cesta</a>
              <a href="/catalogo" class="empty-link">Explorar piezas artesanales</a>
            </div>
          `;
        }
        return;
      }

      const subtotal = items.reduce((acc, it) => acc + Number(it.precioUnitario) * Number(it.cantidad), 0);
      if (subtotalLabel) subtotalLabel.textContent = formatEUR(subtotal);
      if (totalLabel) totalLabel.textContent = formatEUR(total ?? subtotal);

      container.innerHTML = items.map(item => `
        <div class="cart-item-row">
          <div class="item-info">
            <div class="item-title">${item.nombre}</div>
            <div class="item-meta">Cant: ${item.cantidad} × ${formatEUR(item.precioUnitario)}</div>
          </div>
          <div class="item-subtotal font-mono">${formatEUR(Number(item.precioUnitario) * Number(item.cantidad))}</div>
        </div>
      `).join('');
    }

    // 4. Iniciar sesión de checkout y bloqueo de 10 min
    async function iniciarSesionCheckout(items) {
      if (!items || items.length === 0) {
        mostrarCestaVacia();
        return;
      }

      try {
        checkoutForm.clearError();
        const payload = items.map(it => ({ varianteId: it.varianteId, cantidad: it.cantidad }));
        const sesion = await PaymentApiService.iniciarPago(payload);
        currentSession = sesion;

        // Iniciar temporizador regresivo de 10 minutos
        timer.start(sesion.expiresAt);

        // Actualizar formulario y barra lateral
        checkoutForm.setSessionData({
          sesionPagoId: sesion.sesionPagoId,
          items,
          total: sesion.total
        });
        renderSidebarItems(items, sesion.total);
      } catch (err) {
        // FR-008: sin existencias suficientes la tramitación queda bloqueada con aviso claro
        if (err.status === 409 || err.codigo === 'STOCK_INSUFICIENTE') {
          checkoutForm.showError('No hay existencias suficientes para tramitar tu pedido: alguna pieza de tu cesta se ha agotado o está reservada por otro comprador. Revisa tu cesta para ajustar las cantidades o retirar los artículos afectados.');
          checkoutForm.setSubmitting(true);
        } else {
          checkoutForm.showError(`No se pudo iniciar la reserva de compra: ${err.message}`);
        }
        avisarEnlaceCesta();
      }
    }

    function avisarEnlaceCesta() {
      const errorBox = document.querySelector('#checkout-error-box');
      if (errorBox && !errorBox.querySelector('.error-cart-link')) {
        const enlace = document.createElement('a');
        enlace.href = '/carrito';
        enlace.className = 'error-cart-link';
        enlace.textContent = '→ Revisar mi cesta';
        errorBox.appendChild(document.createElement('br'));
        errorBox.appendChild(enlace);
      }
    }

    // 5. Arranque: consumir la cesta persistente real del comprador
    (async () => {
      // Renderizar el formulario desde el principio para disponer del cuadro de avisos
      checkoutForm.setSessionData({ sesionPagoId: null, items: [], total: 0 });

      const items = await cargarCestaPersistente();
      activeItems = items;
      iniciarSesionCheckout(items);
    })();
  </script>
</body>
</html>
